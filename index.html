<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내팔자야</title>
  <meta name="description" content="생년월일시로 사주팔자를 계산하고 Gemini AI로 해석을 받아보세요.">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header">
    <p class="brand">내팔자야</p>
    <p class="tagline">생년월일시로 읽는 나의 사주</p>
  </header>

  <main class="layout">
    <section class="panel form-panel" aria-labelledby="form-heading">
      <h2 id="form-heading" class="panel-title">출생 정보</h2>

      <form id="saju-form" novalidate>
        <div class="field">
          <label for="name">이름 <span class="optional">(선택)</span></label>
          <input type="text" id="name" name="name" placeholder="홍길동" autocomplete="name">
        </div>

        <div class="field-row">
          <div class="field">
            <label for="gender">성별</label>
            <select id="gender" name="gender" required>
              <option value="male">남성</option>
              <option value="female">여성</option>
            </select>
          </div>
          <div class="field">
            <label for="calendar">달력</label>
            <select id="calendar" name="calendar">
              <option value="solar">양력</option>
              <option value="lunar">음력</option>
            </select>
          </div>
        </div>

        <div class="field leap-field is-hidden" id="leap-field">
          <label class="checkbox-label">
            <input type="checkbox" id="leap" name="leap">
            윤달
          </label>
        </div>

        <div class="field">
          <label for="birthdate">생년월일</label>
          <input type="date" id="birthdate" name="birthdate" required min="1800-01-01" max="2100-12-31">
        </div>

        <div class="field-row">
          <div class="field">
            <label for="hour">시</label>
            <select id="hour" name="hour" required>
              <option value="">선택</option>
            </select>
          </div>
          <div class="field">
            <label for="minute">분</label>
            <select id="minute" name="minute" required>
              <option value="">선택</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">
          사주 보기
        </button>
      </form>
    </section>

    <section class="panel result-panel is-hidden" id="result-panel" aria-live="polite">
      <h2 class="panel-title">내 팔자</h2>
      <p class="result-meta" id="result-meta"></p>

      <div class="pillars" id="pillars"></div>

      <div class="meta-grid">
        <div class="meta-block">
          <h3>공망</h3>
          <p id="void-branches">—</p>
        </div>
        <div class="meta-block">
          <h3>대운</h3>
          <p id="luck-summary">—</p>
        </div>
      </div>

      <div class="luck-list is-hidden" id="luck-list"></div>

      <button type="button" class="btn btn-secondary" id="interpret-btn">
        추가 설명 보기
      </button>

      <div class="interpret-area is-hidden" id="interpret-area">
        <h3 class="interpret-title">추가 설명</h3>
        <div class="interpret-status" id="interpret-status" hidden></div>
        <article class="interpret-body" id="interpret-body"></article>
        <p class="disclaimer">본 설명은 참고용 설명이며, 전문 상담을 대체하지 않습니다.</p>
      </div>
    </section>
  </main>

  <p class="form-error is-hidden" id="form-error" role="alert"></p>

  <footer class="site-footer">
    <p>© 2026 내팔자야</p>
  </footer>

  <script type="module" src="public/bundle.js"></script>
</body>
</html>
